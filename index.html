<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="assets/fishicon.png" />
  <title>Flappy Isda</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <audio id="bg-music" autoplay loop>
    <source src="sounds/backgroundmusic.mp3" type="audio/mpeg" />
    Your browser does not support the audio element.
  </audio>

  <div id="offline-error" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: black; color: white; padding: 20px; border: 2px solid red; border-radius: 5px; text-align: center;">
    You are offline. Please check your internet connection.
  </div>

  <div class="background"></div>

  <!-- You can comment out or remove this modal if you don't want a start screen -->
  <!-- <div class="modal" id="start-modal" style="display: none;"></div> -->

  <div class="modal" id="game-over-modal" style="display: none;">
    <div class="modal-content">
      <h2>Game Over</h2>
      <p>Your Score: <span id="final-score">0</span></p>
      <p>High Score: <span id="high-score">0</span></p>
      <div class="button-group">
        <button class="play-again-button">Play Again</button>
        <button class="mute-button" id="mute-button-gameover">Mute</button>
      </div>
    </div>
  </div>

  <img src="assets/isda.png" alt="isda" class="isda" id="isda-1" />
  <div class="score">
    <span class="score_title">Score:</span>
    <span class="score_val">0</span>
  </div>
  <div class="high-score">
    High Score: <span id="high-score-display">0</span>
  </div>
</body>
</html>
